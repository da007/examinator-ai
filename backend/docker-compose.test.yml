services:
  db_test:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass
      - POSTGRES_DB=test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis_test:
    image: redis:7-alpine

  tester:
    build:
      context: .
      dockerfile: docker/app.dockerfile
      target: test
    volumes:
      - ./tests:/app/tests
      - ./app:/app/app
    environment:
      - ENV=TESTING
      - POSTGRES_SERVER=db_test
      - POSTGRES_PORT=5432
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass
      - POSTGRES_DB=test_db
      - DATABASE_URL=postgresql+asyncpg://test_user:test_pass@db_test:5432/test_db
      - REDIS_HOST=redis_test
      - APP_SECRET_KEY=test_secret_key_change_it_in_prod
      - PROJECT_NAME=Test_Examinator
      - PROJECT_API_V1_STR=/api/v1
      - LM_STUDIO_API_KEY=test_mock_key
      - LM_STUDIO_BASE_URL=http://mocked_lmstudio:1234
      - LM_STUDIO_MODEL=test-local-model
      
      # [ДОБАВЛЕНО] Заглушки для S3
      - S3_ENDPOINT=http://mock_s3:9000
      - S3_ACCESS_KEY=mock_access_key
      - S3_SECRET_KEY=mock_secret_key
      
      # [ДОБАВЛЕНО] Заглушки для INIT
      - INIT_SUPERUSER_ORG_ID=00000000-0000-0000-0000-000000000000
      - INIT_SUPERUSER_EMAIL=admin@test.local
      - INIT_SUPERUSER_PASSWORD=mock_pass
    depends_on:
      db_test:
        condition: service_healthy
    # Запускаем pytest, указываем пути
    command: pytest tests/api/ tests/integration/ -v --disable-warnings